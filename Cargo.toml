[package]
name = "wallet_bindings"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = [
    # "staticlib",
    "dylib",
    "rlib",
    # "lib"
]

[[bin]]
name = "generate-headers"
required-features = ["headers"]

[features]
headers = ["safer-ffi/headers"]

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

rand = "0.8"
rand_chacha = "0.3"
rand_core = "0.6"

frost-core = { version = "2.2.0", features = ["serde"] }
frost-rerandomized = { version = "2.1.0", features = ["test-impl"] }
pasta_curves = { version = "0.5.1", features = ["serde"] }
safer-ffi = { version = "0.1.13", features = ["log", "async-fn", "futures", "tokio"] }
serde = "1.0.228"
serde_core = "1.0.228"
thiserror = "2.0.18"
serde_json = "1.0.149"

reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", features = [
    "frost",
    "serde",
] }


tokio = { version = "1.49.0", features = ["full"] }
tonic = { version = "0.14.4", features = ["tls-webpki-roots"] }

zcash_client_sqlite = { version = "0.19.2", features = [
    "orchard",
    "unstable",
    "transparent-inputs",
    "serde",
] }
zcash_primitives = "0.26.4"
zcash_keys = { version = "0.12", features = ["unstable-frost", "orchard"]}
zcash_proofs = {version = "0.26", features = ["bundled-prover"]}
zcash_transparent = { version = "0.6.3", features = ["transparent-inputs"] }
zcash_client_backend = { version = "0.21.0", features = [
    "orchard",
    "pczt",
    "transparent-inputs",
    "lightwalletd-tonic",
    "lightwalletd-tonic-transport",
] }
pczt = { version = "0.5", features = [
    "orchard",
    "prover",
    "sapling",
    "signer",
    "spend-finalizer",
    "transparent",
    "tx-extractor",
    "zcp-builder",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
anyhow = "1.0.101"
hex = "0.4.3"
incrementalmerkletree = "0.8.2"
rusqlite = "0.37.0"
schemerz = "0.2.0"
uuid = "1.21.0"
http = "1.4.0"
futures = "0.3.32"
prost = "0.14.3"
zcash_protocol = "0.7.2"
orchard = { version = "0.11.0", features = ["unstable-frost"]}
eyre = "0.6.12"
halo2_proofs = "0.3.2"
once_cell = "1.21.3"
tokio-util = "0.7.18"
sapling = { package = "sapling-crypto", version = "0.5.0", features = ["circuit"]}
zcash_script = "0.4.2"
v = "0.1.0"
zcash_address = "0.10.1"
dotenvy = "0.15.7"

[patch.crates-io]
# TODO: remove this when https://github.com/zcash/orchard/pull/475 is merged, and
# a all ECC crates are updated to point to the orchard version that includes it.
orchard = { git = "https://github.com/conradoplg/orchard.git", rev = "4d001c5b6ad15373e68a5923d5868fbe42daba96" }
